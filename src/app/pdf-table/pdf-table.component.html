<div class="pdf-table-container">
  <mat-card class="pdf-table-card">
    <mat-card-header>
      <mat-card-title class="mat-card-title">Available PDFs</mat-card-title>
    </mat-card-header>
    <mat-card-content class="pdf-table-content">
      <table mat-table [dataSource]="pdfList" class="mat-elevation-z8">
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>PDF Title</th>
          <td mat-cell *matCellDef="let pdfList">{{ pdfList.title }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>PDF Description</th>
          <td mat-cell *matCellDef="let pdfList">{{ pdfList.description }}</td>
        </ng-container>

        <ng-container matColumnDef="view">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let pdfList">
            <button (click)="navigateToPdfViewer(pdfList.id)" mat-icon-button>
              <mat-icon>arrow_forward</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
